services:
  love-pipeline:
    image: registry.eberrik.local:5000/love-pipeline:latest
    container_name: love-pipeline
    ports:
      - "8501:8501"
    volumes:
      - ~/love-pipeline-photos:/home/eberrik/app/photos
    restart: unless-stopped
    environment:
      - REGISTRY_URL=http://registry.eberrik.local:5000/v2
      - REGISTRY_USER=eberrik
      - REGISTRY_PASS=${REGISTRY_PASS}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - love-net
    extra_hosts:
      - "registry.eberrik.local:host-gateway"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: love-tunnel
    restart: unless-stopped
    command:
      - "http"
      - "love-pipeline:8501"
      - "--request-header-add"
      - "ngrok-skip-browser-warning:true"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    ports:
      - "4040:4040"
    networks:
      - love-net
    depends_on:
      - love-pipeline

networks:
  love-net:
    driver: bridge
